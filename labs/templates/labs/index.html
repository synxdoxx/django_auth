{% load static %}
<!doctype html>
<html lang="ru">
<head>
    <link rel="stylesheet" href="{% static 'vendor/bootstrap/css/bootstrap.min.css' %}">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Сдача лабораторных работ</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.5.1/dist/css/tabler.min.css">
</head>
<body>
<div class="page">
    <div class="page-wrapper">
        <div class="container-xl py-4">
            <h1 class="mb-4">Сдача лабораторных работ</h1>
            {% csrf_token %}
            <div id="message" role="status" aria-live="polite"></div>

            <!-- Форма создания заявки -->
            <div class="card mb-4">
                <div class="card-body">
                    <form id="submission-form">
                        <div class="mb-3">
                            <label class="form-label">Комментарий</label>
                            <input id="comment" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Лабораторная</label>
                            <select id="lab" class="form-select" required></select>
                        </div>
                        <button class="btn btn-primary" type="submit">Сдать работу</button>
                    </form>
                </div>
            </div>

            <!-- Блок списка и фильтрации -->
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">Список работ</h2>
                </div>
                <div class="card-body">
                        <div class="row mb-3">
                            <div class="col">
                                <select id="status-filter" class="form-select">
                                    <option value="">Все статусы</option>
                                    <option value="new">Сдана</option>
                                    <option value="booked">Записана на защиту</option>
                                    <option value="accepted">Принята</option>
                                </select>
                            </div>
                            <div class="col">
                                <select id="lab-filter" class="form-select"></select>
                            </div>
                        </div>
                    <div id="loading" hidden>Загрузка данных...</div>
                    <div id="submissions-list"></div>
                </div>
            </div>
                <div class="card mt-4">
                    <div class="card-header"><h2 class="card-title">История событий</h2></div>
                    <div class="card-body"><pre id="history" class="mb-0">Нажмите «История» у нужной работы</pre></div>
                </div>
        </div>
    </div>
</div>

<script src="{% static 'vendor/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
<script src="{% static 'labs/app.js' %}"></script>
</body>
</html>
